<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NotRa Uptime Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    body {
      background: #0b0f19;
      color: #f1f5f9;
      min-height: 100vh;
      padding: 24px 16px;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
    }

    .header h1 {
      font-size: 1.75rem;
      font-weight: 700;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 28px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
    }

    .card h3 {
      font-size: 1.1rem;
      font-weight: 600;
      color: #e2e8f0;
      margin-bottom: 16px;
    }

    .form-group {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    @media (min-width: 640px) {
      .form-group {
        grid-template-columns: 2fr 3fr 1.5fr 1.5fr;
      }
    }

    input, select, button {
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #f8fafc;
      font-size: 0.9rem;
      outline: none;
      transition: all 0.2s ease;
    }

    input:focus, select:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
    }

    button.btn-add {
      background: #0284c7;
      color: #ffffff;
      font-weight: 600;
      border: none;
      cursor: pointer;
    }

    button.btn-add:hover {
      background: #0369a1;
    }

    .table-container {
      width: 100%;
      overflow-x: auto;
      border-radius: 8px;
      border: 1px solid #334155;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 680px;
      text-align: left;
    }

    th {
      background: #0f172a;
      color: #94a3b8;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 14px 16px;
      border-bottom: 1px solid #334155;
    }

    td {
      padding: 14px 16px;
      border-bottom: 1px solid #334155;
      font-size: 0.9rem;
      color: #cbd5e1;
      white-space: nowrap;
    }

    tr:last-child td {
      border-bottom: none;
    }

    .url-link {
      color: #38bdf8;
      text-decoration: none;
      font-weight: 500;
    }

    .url-link:hover {
      text-decoration: underline;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 600;
    }

    .badge-up {
      background: rgba(34, 197, 94, 0.15);
      color: #4ade80;
      border: 1px solid rgba(74, 222, 128, 0.3);
    }

    .badge-down {
      background: rgba(239, 68, 68, 0.15);
      color: #fca5a5;
      border: 1px solid rgba(252, 165, 165, 0.3);
    }

    .badge-pending {
      background: rgba(234, 179, 8, 0.15);
      color: #fef08a;
      border: 1px solid rgba(254, 240, 138, 0.3);
    }

    .btn-delete {
      background: rgba(239, 68, 68, 0.2);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.4);
      padding: 6px 12px;
      font-size: 0.8rem;
      cursor: pointer;
      border-radius: 6px;
    }

    .btn-delete:hover {
      background: #dc2626;
      color: #ffffff;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>⚡ NotRa Uptime</h1>
    </div>

    <!-- Add Monitor Card -->
    <div class="card">
      <h3>Add New Target</h3>
      <form id="monitorForm" class="form-group">
        <input type="text" id="name" placeholder="App Name (e.g. My App)" required>
        <input type="url" id="url" placeholder="https://your-app.streamlit.app" required>
        <select id="interval">
          <option value="1">Every 1 min</option>
          <option value="2">Every 2 min</option>
          <option value="5" selected>Every 5 min</option>
          <option value="10">Every 10 min</option>
          <option value="15">Every 15 min</option>
          <option value="30">Every 30 min</option>
          <option value="60">Every 60 min</option>
        </select>
        <button type="submit" class="btn-add">Add Monitor</button>
      </form>
    </div>

    <!-- Active Monitors Card -->
    <div class="card">
      <h3>Monitored Targets</h3>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>URL</th>
              <th>Interval</th>
              <th>Status</th>
              <th>Last Checked</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="monitorList">
            <!-- Content rendered dynamically -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('monitorForm');
    const monitorList = document.getElementById('monitorList');

    function formatTime(isoString) {
      if (!isoString) return 'Pending...';
      const date = new Date(isoString);
      return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }

    async function loadMonitors() {
      try {
        const res = await fetch('/api/monitors');
        const data = await res.json();
        
        monitorList.innerHTML = data.map(m => `
          <tr>
            <td><strong>${m.name}</strong></td>
            <td><a href="${m.url}" target="_blank" class="url-link">${m.url}</a></td>
            <td>${m.interval}m</td>
            <td><span class="badge badge-${m.status.toLowerCase()}">${m.status}</span></td>
            <td>${formatTime(m.lastChecked)}</td>
            <td><button class="btn-delete" onclick="deleteMonitor('${m.id}')">Delete</button></td>
          </tr>
        `).join('');
      } catch (err) {
        console.error('Error loading monitors:', err);
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value;
      const url = document.getElementById('url').value;
      const interval = document.getElementById('interval').value;

      await fetch('/api/monitors', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, url, interval })
      });

      form.reset();
      loadMonitors();
    });

    async function deleteMonitor(id) {
      await fetch(`/api/monitors/${id}`, { method: 'DELETE' });
      loadMonitors();
    }

    setInterval(loadMonitors, 5000);
    loadMonitors();
  </script>
</body>
</html>
